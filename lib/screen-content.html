<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Screen Content Tracker — Invest Lagos 3.0</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy:#071f10;--gold:#4ade80;--gold-soft:#dcfce7;--gold-mid:#22c55e;
      --cream:#F6F5F1;--border:#DDD9CF;--muted:#64748B;--ink:#1E293B;
      --white:#FFFFFF;--bg:#ECEAE4;
      --font:'Poppins',sans-serif;--mono:'JetBrains Mono',monospace;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{font-size:14px}
    body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}

    /* ── Header ── */
    .page-header{background:var(--navy);padding:.875rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
    .header-left{display:flex;align-items:center;gap:.875rem}
    .header-logo{height:30px;width:auto}
    .header-title{font-weight:700;font-size:.92rem;color:var(--white)}
    .header-sub{font-family:var(--mono);font-size:.44rem;color:var(--gold);letter-spacing:.15em;text-transform:uppercase;margin-top:.15rem}
    .header-nav{display:flex;align-items:center;gap:.5rem}
    .header-link{font-size:.7rem;color:rgba(255,255,255,.7);text-decoration:none;border:1px solid rgba(255,255,255,.2);padding:.3rem .7rem;transition:all .15s}
    .header-link:hover{color:var(--gold);border-color:var(--gold)}

    /* ── Stats bar ── */
    .stats-bar{background:var(--white);border-bottom:1px solid var(--border);padding:.625rem 1.5rem;display:flex;align-items:center;gap:1.75rem;flex-wrap:wrap}
    .stat{display:flex;align-items:baseline;gap:.35rem}
    .stat-num{font-family:var(--mono);font-size:1.05rem;font-weight:500;color:var(--navy)}
    .stat-label{font-size:.68rem;color:var(--muted)}
    .stat-div{height:14px;width:1px;background:var(--border)}

    /* ── Filters ── */
    .filters{background:var(--white);border-bottom:1px solid var(--border);padding:.625rem 1.5rem;display:flex;align-items:center;gap:.625rem;flex-wrap:wrap}
    .search-wrap{position:relative;flex:1;min-width:180px;max-width:300px}
    .search-wrap svg{position:absolute;left:.625rem;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--muted);pointer-events:none}
    .search-wrap input{width:100%;padding:.4rem .75rem .4rem 2rem;border:1px solid var(--border);font-family:var(--font);font-size:.78rem;color:var(--ink);background:var(--cream);outline:none;border-radius:0}
    .search-wrap input:focus{border-color:var(--navy)}
    .filter-group{display:flex;align-items:center;gap:.3rem}
    .filter-label{font-family:var(--mono);font-size:.44rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
    .filter-select{padding:.38rem .55rem;border:1px solid var(--border);font-family:var(--font);font-size:.72rem;color:var(--ink);background:var(--cream);cursor:pointer;outline:none;border-radius:0}
    .filter-select:focus{border-color:var(--navy)}
    .clear-btn{font-family:var(--font);font-size:.7rem;color:var(--muted);background:none;border:none;cursor:pointer;padding:.38rem .4rem;text-decoration:underline;text-underline-offset:2px}
    .clear-btn:hover{color:var(--ink)}
    .result-count{font-family:var(--mono);font-size:.46rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;padding:.5rem 1.5rem .25rem}

    /* ── Table ── */
    .table-wrap{padding:.75rem 1.5rem 2rem;overflow-x:auto}
    table{width:100%;border-collapse:collapse;background:var(--white);font-size:.78rem}
    thead th{
      background:var(--navy);color:var(--white);font-weight:600;font-size:.66rem;
      letter-spacing:.04em;padding:.625rem .75rem;text-align:left;white-space:nowrap;
      cursor:pointer;user-select:none;border-right:1px solid rgba(255,255,255,.07)
    }
    thead th:last-child{border-right:none;cursor:default}
    thead th:hover:not(:last-child){background:#0d3320}
    .sort-arrow{margin-left:.3rem;font-size:.55rem;opacity:.35}
    thead th.sort-asc .sort-arrow::after{content:'↑';opacity:1}
    thead th.sort-desc .sort-arrow::after{content:'↓';opacity:1}
    thead th:not(.sort-asc):not(.sort-desc) .sort-arrow::after{content:'⇅'}
    tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
    tbody tr:nth-child(even){background:#fafaf8}
    tbody tr:hover{background:#f4f3ef !important}
    tbody tr.hidden{display:none}
    tbody td{padding:.55rem .75rem;vertical-align:top;border-right:1px solid #f0ede6}
    tbody td:last-child{border-right:none}

    /* ── Column widths ── */
    .col-day{min-width:75px}
    .col-session{min-width:155px;max-width:200px;font-size:.7rem;color:var(--muted);line-height:1.4}
    .col-time{min-width:50px;font-family:var(--mono);font-size:.62rem;color:var(--muted);white-space:nowrap}
    .col-desc{min-width:270px;max-width:340px;line-height:1.55}
    .col-type{min-width:115px;white-space:nowrap}
    .col-screen{min-width:140px;font-size:.7rem;color:var(--muted);line-height:1.4}
    .col-team{min-width:160px;font-size:.7rem;line-height:1.4}
    .col-status{min-width:105px}
    .col-notes{min-width:190px;max-width:260px;font-size:.68rem;color:var(--muted);line-height:1.55}

    /* ── Chips ── */
    .day-chip{display:inline-block;font-family:var(--mono);font-size:.43rem;letter-spacing:.1em;text-transform:uppercase;padding:.15rem .4rem;white-space:nowrap}
    .day-chip.d1{background:var(--navy);color:var(--white)}
    .day-chip.d1g{background:#112244;color:#93c5fd}
    .day-chip.gala{background:#0B1F45;color:#a5b4fc}
    .day-chip.d2{background:#14532d;color:var(--gold)}

    .type-badge{display:inline-block;font-family:var(--mono);font-size:.43rem;letter-spacing:.07em;text-transform:uppercase;padding:.18rem .42rem;background:#f0ede6;color:#64748b;white-space:nowrap}

    .status-chip{display:inline-flex;align-items:center;gap:.25rem;font-size:.66rem;font-weight:500;padding:.22rem .55rem;cursor:pointer;user-select:none;border:1px solid transparent;transition:all .15s;white-space:nowrap}
    .status-chip:hover{opacity:.8}
    .status-chip.not-started{background:#f0ede6;color:var(--muted);border-color:var(--border)}
    .status-chip.in-progress{background:#fef9c3;color:#a16207;border-color:#fde047}
    .status-chip.ready{background:var(--gold-soft);color:#166534;border-color:var(--gold)}

    .tbc{font-family:var(--mono);font-size:.43rem;letter-spacing:.08em;text-transform:uppercase;background:#fef3c7;color:#b45309;padding:.1rem .3rem;vertical-align:middle;margin-left:.2rem}

    .empty-state{text-align:center;padding:3rem;color:var(--muted);font-size:.85rem}
    .no-results{display:none}
    .no-results.visible td{text-align:center;padding:2.5rem;color:var(--muted);border:none;font-size:.8rem}
  </style>
</head>

// ── Status management ──────────────────────────────────────────────────────
const STATUS_CYCLE = ['not-started','in-progress','ready'];
const STATUS_LABELS = {'not-started':'Not Started','in-progress':'In Progress','ready':'Ready'};
const STORAGE_KEY = 'lsif_screen_status';

function loadStatuses() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch(e) { return {}; }
}
function saveStatuses(s) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch(e) {}
}

let statuses = loadStatuses();

function getStatus(id) {
  return statuses[id] || 'not-started';
}

function cycleStatus(id) {
  const cur = getStatus(id);
  const idx = STATUS_CYCLE.indexOf(cur);
  const next = STATUS_CYCLE[(idx + 1) % STATUS_CYCLE.length];
  statuses[id] = next;
  saveStatuses(statuses);
  const chip = document.querySelector('[data-row-id="' + id + '"]');
  if (chip) {
    chip.className = 'status-chip ' + next;
    chip.textContent = STATUS_LABELS[next];
  }
  updateStats();
  applyFilters();
}

// ── Day chip class ─────────────────────────────────────────────────────────
function dayClass(day) {
  if (day === 'Day 2') return 'd2';
  if (day === 'Gala Dinner') return 'gala';
  if (day === 'Day 1 / Gala') return 'd1g';
  return 'd1';
}

// ── Render rows ────────────────────────────────────────────────────────────
function renderRows(data) {
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';

  const noRow = document.createElement('tr');
  noRow.className = 'no-results';
  noRow.innerHTML = '<td colspan="9">No assets match your filters.</td>';
  tbody.appendChild(noRow);

  data.forEach(r => {
    const st = getStatus(r.id);
    const tr = document.createElement('tr');
    tr.dataset.id = r.id;
    tr.dataset.day = r.day;
    tr.dataset.type = r.type;
    tr.dataset.team = r.team;
    tr.dataset.status = st;
    tr.dataset.search = [r.session, r.desc, r.team, r.screen, r.notes, r.type].join(' ').toLowerCase();

    tr.innerHTML =
      '<td class="col-day"><span class="day-chip ' + dayClass(r.day) + '">' + r.day + '</span></td>' +
      '<td class="col-session">' + r.session + '</td>' +
      '<td class="col-time">' + r.time + '</td>' +
      '<td class="col-desc">' + r.desc + '</td>' +
      '<td class="col-type"><span class="type-badge">' + r.type + '</span></td>' +
      '<td class="col-screen">' + r.screen + '</td>' +
      '<td class="col-team">' + r.team + '</td>' +
      '<td class="col-status"><span class="status-chip ' + st + '" data-row-id="' + r.id + '" onclick="cycleStatus(\'' + r.id + '\')">' + STATUS_LABELS[st] + '</span></td>' +
      '<td class="col-notes">' + (r.notes || '—') + '</td>';

    tbody.appendChild(tr);
  });
}

// ── Sorting ────────────────────────────────────────────────────────────────
let sortCol = -1;
let sortDir = 1;

function sortTable(col) {
  if (sortCol === col) {
    sortDir *= -1;
  } else {
    sortCol = col;
    sortDir = 1;
  }
  const ths = document.querySelectorAll('thead th');
  ths.forEach((th, i) => {
    th.classList.remove('sort-asc', 'sort-desc');
    if (i === col) th.classList.add(sortDir === 1 ? 'sort-asc' : 'sort-desc');
  });

  const keys = ['day','session','time','desc','type','screen','team'];
  const key = keys[col];
  if (!key) return;

  const sorted = [...currentData].sort((a, b) => {
    const va = (a[key] || '').toLowerCase();
    const vb = (b[key] || '').toLowerCase();
    if (va < vb) return -sortDir;
    if (va > vb) return sortDir;
    return 0;
  });

  currentData = sorted;
  renderRows(sorted);
  applyFilters();
}

// ── Filtering ──────────────────────────────────────────────────────────────
let currentData = [...rows];

function applyFilters() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const fDay = document.getElementById('f-day').value;
  const fType = document.getElementById('f-type').value;
  const fTeam = document.getElementById('f-team').value;
  const fStatus = document.getElementById('f-status').value;

  let visible = 0;
  const trs = document.querySelectorAll('#table-body tr[data-id]');
  trs.forEach(tr => {
    const matchQ = !q || tr.dataset.search.includes(q);
    const matchDay = !fDay || tr.dataset.day === fDay;
    const matchType = !fType || tr.dataset.type === fType;
    const matchTeam = !fTeam || tr.dataset.team === fTeam;
    const st = getStatus(tr.dataset.id);
    const matchStatus = !fStatus || st === fStatus;
    tr.dataset.status = st;

    const show = matchQ && matchDay && matchType && matchTeam && matchStatus;
    tr.classList.toggle('hidden', !show);
    if (show) visible++;
  });

  const noRow = document.querySelector('.no-results');
  if (noRow) noRow.classList.toggle('visible', visible === 0);

  const rc = document.getElementById('result-count');
  if (rc) rc.textContent = visible + ' of ' + rows.length + ' assets';
  updateStats();
}

function clearFilters() {
  document.getElementById('search').value = '';
  document.getElementById('f-day').value = '';
  document.getElementById('f-type').value = '';
  document.getElementById('f-team').value = '';
  document.getElementById('f-status').value = '';
  applyFilters();
}

// ── Stats bar ──────────────────────────────────────────────────────────────
function updateStats() {
  const total = rows.length;
  let notStarted = 0, inProgress = 0, ready = 0, tbcCount = 0;
  rows.forEach(r => {
    const s = getStatus(r.id);
    if (s === 'not-started') notStarted++;
    else if (s === 'in-progress') inProgress++;
    else if (s === 'ready') ready++;
    if (r.notes.toLowerCase().includes('tbc') || r.desc.toLowerCase().includes('tbc')) tbcCount++;
  });

  document.getElementById('stats-bar').innerHTML =
    '<div class="stat"><span class="stat-num">' + total + '</span><span class="stat-label">total assets</span></div>' +
    '<div class="stat-div"></div>' +
    '<div class="stat"><span class="stat-num">' + notStarted + '</span><span class="stat-label">not started</span></div>' +
    '<div class="stat-div"></div>' +
    '<div class="stat"><span class="stat-num" style="color:#a16207">' + inProgress + '</span><span class="stat-label">in progress</span></div>' +
    '<div class="stat-div"></div>' +
    '<div class="stat"><span class="stat-num" style="color:#166534">' + ready + '</span><span class="stat-label">ready</span></div>' +
    '<div class="stat-div"></div>' +
    '<div class="stat"><span class="stat-num" style="color:#b45309">' + tbcCount + '</span><span class="stat-label">awaiting confirmation</span></div>';
}

// ── Init ───────────────────────────────────────────────────────────────────
currentData = [...rows];
renderRows(currentData);
updateStats();
applyFilters();
</script>

</body>
</html>
